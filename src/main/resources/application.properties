spring.application.name=rtm-api-gateway
server.port=${GATEWAY_PORT:8080}

# Carga las variables del archivo .env (solo en local)
spring.config.import=optional:file:.env[.properties]

# Dónde está cada servicio (en local, cada uno en su puerto)
app.gateway.services.iam=${IAM_URL:http://localhost:3001}
app.gateway.services.fleet-maintenance=${FLEET_URL:http://localhost:3002}
app.gateway.services.booking-reservation=${BOOKING_URL:http://localhost:3003}
app.gateway.services.payment-billing=${PAYMENT_URL:http://localhost:3004}
app.gateway.services.telemetry-gps=${TELEMETRY_URL:http://localhost:3005}

# Orígenes que pueden llamar al gateway desde el navegador (separados por coma). 5173 = Vite.
app.gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Rutas (tabla de enrutamiento de api-gateway.yaml) ───────────────────────────────────

# /auth/login -> iam /login  (StripPrefix=1 quita el primer tramo: "/auth")
spring.cloud.gateway.server.webmvc.routes[0].id=iam-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${app.gateway.services.iam}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# /users/** -> iam /users/** (sin cambiar la ruta)
spring.cloud.gateway.server.webmvc.routes[1].id=iam-users
spring.cloud.gateway.server.webmvc.routes[1].uri=${app.gateway.services.iam}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=fleet-maintenance
spring.cloud.gateway.server.webmvc.routes[2].uri=${app.gateway.services.fleet-maintenance}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/vehicles/**,/branches/**

spring.cloud.gateway.server.webmvc.routes[3].id=booking-reservation
spring.cloud.gateway.server.webmvc.routes[3].uri=${app.gateway.services.booking-reservation}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/reservations/**,/rentals/**,/notifications/**

spring.cloud.gateway.server.webmvc.routes[4].id=payment-billing
spring.cloud.gateway.server.webmvc.routes[4].uri=${app.gateway.services.payment-billing}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/payments/**,/invoices/**,/bank-accounts/**

spring.cloud.gateway.server.webmvc.routes[5].id=telemetry-gps
spring.cloud.gateway.server.webmvc.routes[5].uri=${app.gateway.services.telemetry-gps}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/tracking/**
